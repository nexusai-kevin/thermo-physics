name: Live-Stream Data Refinery

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-refinery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refinery:
    name: Refresh Live Empirical Streams & Verify Refinery (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --extra thrml --extra dev

      - name: Run 5-phase live-stream data refinery
        run: |
          uv run python scripts/run_live_refinery.py --verify

      - name: Run live data refinery verification suite
        run: |
          uv run pytest tests/test_live_data_refinery.py -v

      - name: Upload live refinery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live-data-refinery-${{ github.run_id }}
          path: |
            data/live_empirical_streams.json
            data/benchmark_manifest.json
            data/historical_vault/
          retention-days: 30

      - name: Commit and push updated empirical streams & vault
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_empirical_streams.json data/benchmark_manifest.json data/historical_vault/
          if [ -f docs/benchmark_manifest.json ]; then
            git add docs/benchmark_manifest.json
          fi
          git diff --cached --quiet || (git commit -m "chore(refinery): update live empirical streams and historical vault [skip ci]" && git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push)
