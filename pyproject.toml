[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermo-physics"
version = "0.1.0"
description = "Reference Implementations, Hardware Adapters, and Reproducibility Suite for Thermodynamic Computing (Extropic thrml, JAX, EBMs, and Block Gibbs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.26.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
thrml = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "thrml>=0.1.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
thermo-suite = "thermo_repro.benchmark_runner:main"
thrml-bench = "cli:app"

[tool.hatch.build.targets.wheel]
packages = ["thermo_repro", "thermo_physics", "cli.py"]
